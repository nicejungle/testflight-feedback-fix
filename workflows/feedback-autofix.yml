name: Feedback Auto-Fix

on:
  workflow_dispatch:
    inputs:
      feedback_id:
        description: 'Feedback ID (optional, for webhook trigger)'
        required: false

permissions:
  contents: write

jobs:
  check-and-fix:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" ~/Library/Keychains/login.keychain-db
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch feedback
        id: feedback
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          FEEDBACK_ID: ${{ inputs.feedback_id }}
        run: |
          cd scripts
          npm install --silent 2>/dev/null || true
          npx tsx fetch-feedback.ts 2>&1

          FEEDBACK_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/feedback.json','utf8')).length)" 2>/dev/null || echo "0")
          echo "count=$FEEDBACK_COUNT" >> $GITHUB_OUTPUT

      - name: Claude auto-fix
        if: steps.feedback.outputs.count != '0'
        run: |
          FEEDBACK=$(cat /tmp/feedback.json)

          claude -p "You are working on an iOS project.

          The following TestFlight feedback was just received:

          ${FEEDBACK}

          Instructions:
          1. Analyze each feedback item
          2. Only fix clearly actionable bugs or UX issues
          3. Skip vague comments or feature requests
          4. Make minimal, targeted code changes
          5. Commit each fix: git commit -m 'fix: <description based on feedback>'
          6. Do NOT push — the workflow handles that" \
          --print --dangerously-skip-permissions 2>&1 | tail -100

      - name: Build verification
        if: steps.feedback.outputs.count != '0'
        run: |
          COMMIT_COUNT=$(git log origin/main..HEAD --oneline | wc -l | tr -d ' ')
          if [ "$COMMIT_COUNT" -le 1 ]; then
            echo "No code fixes, skipping build check"
            exit 0
          fi

          echo "Verifying build..."
          # UPDATE: Replace with your project and scheme
          xcodebuild build -project YourApp.xcodeproj -scheme YourApp \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -quiet 2>&1 | tail -5

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Build failed — reverting changes"
            git reset --hard origin/main
            exit 1
          fi

          echo "Running tests..."
          # UPDATE: Replace with your test target
          xcodebuild test -project YourApp.xcodeproj -scheme YourApp \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -only-testing:YourAppTests -quiet 2>&1 | tail -5

          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "Tests failed — reverting changes"
            git reset --hard origin/main
            exit 1
          fi

          echo "Build and tests passed"

      - name: Track processed feedback
        if: steps.feedback.outputs.count != '0'
        run: |
          mkdir -p .github
          EXISTING=$(cat .github/processed-feedback.json 2>/dev/null || echo '[]')
          NEW_IDS=$(node -e "
            const existing = ${EXISTING};
            const newItems = JSON.parse(require('fs').readFileSync('/tmp/feedback.json','utf8'));
            const merged = [...new Set([...existing, ...newItems.map(i => i.id)])].slice(-100);
            console.log(JSON.stringify(merged));
          ")
          echo "$NEW_IDS" > .github/processed-feedback.json
          git add .github/processed-feedback.json
          git diff --cached --quiet || git commit -m "chore: track processed feedback IDs"

      - name: Push and deploy
        if: steps.feedback.outputs.count != '0'
        run: |
          COMMIT_COUNT=$(git log origin/main..HEAD --oneline | wc -l | tr -d ' ')
          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo "Pushing $COMMIT_COUNT commits..."
            git pull origin main --rebase
            git push origin main
            git fetch origin release
            git checkout release
            git merge main --no-edit -X theirs || (git checkout --theirs . && git add -A && git commit --no-edit)
            git push origin release
            echo "Done — release build will trigger automatically"
          else
            echo "No fixes were made"
          fi
