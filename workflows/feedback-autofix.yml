name: Feedback Auto-Fix

on:
  workflow_dispatch:
    inputs:
      feedback_id:
        description: 'Feedback ID from Apple webhook'
        required: false
      feedback_type:
        description: 'Feedback type (screenshot/crash)'
        required: false

permissions:
  contents: write

jobs:
  check-and-fix:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" ~/Library/Keychains/login.keychain-db
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch feedback
        id: feedback
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          FEEDBACK_ID: ${{ inputs.feedback_id }}
        run: |
          cd scripts
          npm install --silent 2>/dev/null || true
          npx tsx scripts/fetch-feedback.ts 2>&1

          FEEDBACK_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/feedback.json','utf8')).length)" 2>/dev/null || echo "0")
          echo "count=$FEEDBACK_COUNT" >> $GITHUB_OUTPUT

      - name: Claude auto-fix
        if: steps.feedback.outputs.count != '0'
        run: |
          FEEDBACK=$(cat /tmp/feedback.json)

          : > /tmp/claude-live.log

          claude -p "You are working on an iOS project.

          The following TestFlight feedback was just received:

          ${FEEDBACK}

          Instructions:
          1. Analyze each feedback item
          2. Only fix clearly actionable bugs or UX issues
          3. Skip vague comments or feature requests
          4. Make minimal, targeted code changes
          5. Commit each fix: git commit -m 'fix: <description>'
          6. Do NOT push — the workflow handles that" \
          --output-format stream-json --print --verbose --dangerously-skip-permissions 2>/dev/null \
          | node -e "
            const readline = require('readline');
            const fs = require('fs');
            const rl = readline.createInterface({ input: process.stdin });
            const log = fs.createWriteStream('/tmp/claude-live.log', { flags: 'a' });
            rl.on('line', (line) => {
              try {
                const obj = JSON.parse(line);
                if (obj.type === 'stream_event') {
                  const ev = obj.event;
                  if (ev.type === 'content_block_delta' && ev.delta?.text) {
                    log.write(ev.delta.text);
                  }
                  if (ev.type === 'content_block_start' && ev.content_block?.type === 'tool_use') {
                    log.write('\n🔧 ' + ev.content_block.name + '\n');
                  }
                  if (ev.type === 'content_block_stop') {
                    log.write('\n');
                  }
                }
                if (obj.type === 'assistant') {
                  const texts = (obj.message?.content || []).filter(c => c.type === 'text').map(c => c.text);
                  if (texts.length) log.write(texts.join('\n') + '\n---\n');
                }
              } catch {}
            });
          "

      - name: Build verification
        if: steps.feedback.outputs.count != '0'
        run: |
          LOG=/tmp/claude-live.log
          log() { echo "$1"; echo "$1" >> $LOG; }

          COMMIT_COUNT=$(git log origin/main..HEAD --oneline | wc -l | tr -d ' ')
          if [ "$COMMIT_COUNT" -le 1 ]; then
            log "No code fixes, skipping build check"
            exit 0
          fi

          PROJ="YourApp.xcodeproj"
          SCHEME="CalorieCoach"
          DEST="platform=iOS Simulator,name=iPhone 17 Pro"
          FAILED_TESTS=""

          MAX_RETRIES=3
          for ATTEMPT in $(seq 1 $MAX_RETRIES); do
            log "=== Verify attempt $ATTEMPT/$MAX_RETRIES ==="

            # Step 1: Build
            log "🔨 Building..."
            set +e
            BUILD_OUTPUT=$(xcodebuild build -project $PROJ -scheme $SCHEME -destination "$DEST" -quiet 2>&1)
            BUILD_EXIT=$?
            set -e

            if [ $BUILD_EXIT -ne 0 ]; then
              log "❌ Build failed"
              echo "$BUILD_OUTPUT" | tail -5 | while IFS= read -r l; do log "  $l"; done
              if [ $ATTEMPT -lt $MAX_RETRIES ]; then
                log "🤖 Asking Claude to fix build errors..."
                echo "$BUILD_OUTPUT" | tail -30 > /tmp/build-errors.txt
                claude -p "Build failed. Fix these compilation errors and commit：
          $(cat /tmp/build-errors.txt)
          Only fix build errors. Commit: git commit -m 'fix: resolve build error'" \
                --print --dangerously-skip-permissions 2>&1 | while IFS= read -r l; do echo "$l"; echo "$l" >> $LOG; done
                continue
              fi
              log "💀 Build still failing — reverting"
              git reset --hard origin/main
              exit 1
            fi
            log "✅ Build passed"

            # Step 2: Run tests (only failed ones on retry)
            if [ -n "$FAILED_TESTS" ]; then
              log "🧪 Re-running failed tests only..."
              TEST_FILTER="$FAILED_TESTS"
            else
              log "🧪 Running all unit tests..."
              TEST_FILTER="-only-testing:YourAppTests"
            fi

            set +e
            TEST_OUTPUT=$(xcodebuild test -project $PROJ -scheme $SCHEME -destination "$DEST" $TEST_FILTER -quiet 2>&1)
            TEST_EXIT=$?
            set -e

            if [ $TEST_EXIT -ne 0 ]; then
              FAILED_TESTS=$(echo "$TEST_OUTPUT" | grep -E "Test Case.*failed" | sed 's/.*\[//' | sed 's/\].*//' | awk '{print "-only-testing:YourAppTests/" $0}' | tr '\n' ' ')
              FAIL_COUNT=$(echo "$TEST_OUTPUT" | grep -c "failed" || true)
              log "❌ Tests failed ($FAIL_COUNT failures)"
              echo "$TEST_OUTPUT" | grep -E "failed|error:" | tail -10 | while IFS= read -r l; do log "  $l"; done

              if [ $ATTEMPT -lt $MAX_RETRIES ]; then
                log "🤖 Asking Claude to fix test failures..."
                echo "$TEST_OUTPUT" | grep -E "failed|error:|FAIL" | tail -15 > /tmp/test-errors.txt
                claude -p "Unit tests failed. Fix these errors and commit：
          $(cat /tmp/test-errors.txt)
          Analyze and fix. Commit: git commit -m 'fix: resolve test failure'" \
                --print --dangerously-skip-permissions 2>&1 | while IFS= read -r l; do echo "$l"; echo "$l" >> $LOG; done
                continue
              fi
              log "💀 Tests still failing — reverting"
              git reset --hard origin/main
              exit 1
            fi

            log "✅ All checks passed (attempt $ATTEMPT)"
            break
          done

      - name: Track processed feedback
        if: steps.feedback.outputs.count != '0'
        run: |
          mkdir -p .github
          EXISTING=$(cat .github/processed-feedback.json 2>/dev/null || echo '[]')
          NEW_IDS=$(node -e "
            const existing = ${EXISTING};
            const newItems = JSON.parse(require('fs').readFileSync('/tmp/feedback.json','utf8'));
            const merged = [...new Set([...existing, ...newItems.map(i => i.id)])].slice(-100);
            console.log(JSON.stringify(merged));
          ")
          echo "$NEW_IDS" > .github/processed-feedback.json
          git add .github/processed-feedback.json
          git diff --cached --quiet || git commit -m "chore: track processed feedback IDs"

      - name: Push and deploy
        if: steps.feedback.outputs.count != '0'
        run: |
          COMMIT_COUNT=$(git log origin/main..HEAD --oneline | wc -l | tr -d ' ')
          if [ "$COMMIT_COUNT" -gt 0 ]; then
            echo "Pushing $COMMIT_COUNT commits to main and release..."
            git pull origin main --rebase
            git push origin main
            git fetch origin release
            git checkout release
            git merge main --no-edit -X theirs || (git checkout --theirs . && git add -A && git commit --no-edit)
            git push origin release
            echo "Done — TestFlight build will trigger automatically"
          else
            echo "No fixes were made"
          fi
